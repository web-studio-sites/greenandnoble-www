# Sveltia CMS config: the content types editors see and the fields in each
# form. Field names must match src/schemas.ts. See README.md.

backend:
  name: github
  repo: simonclay/greenandnoble-source # Set per site: the site's private source repo
  branch: main
  base_url: https://sveltia-cms-auth.cms-tools.workers.dev # GitHub login helper (Cloudflare Worker, shared by all sites)

media_folder: public/assets/images/uploads
public_folder: /assets/images/uploads

# Uploaded photos are converted to WebP and capped at 1920px, and file names
# are cleaned up (no spaces), so a straight-from-camera or stock image doesn't
# add megabytes to every page.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1920
          height: 1920

collections:
  - name: pages
    label: Pages
    icon: description
    files:
      - name: home
        label: Homepage
        file: src/content/pages/home.json
        fields:
          - { name: metaTitle, label: "SEO: page title (browser tab and Google)", widget: string, hint: "Around 50 to 60 characters. Put the service and area first, e.g. Garden Maintenance in Richmond | Green & Noble" }
          - { name: metaDescription, label: "SEO: description (Google search results)", widget: text, hint: "Around 140 to 160 characters. A plain summary that makes people want to click." }
          - { name: shareImage, label: "SEO: share picture (optional)", widget: image, required: false, hint: "Shown when the page is shared on WhatsApp, Facebook or LinkedIn. Leave empty to use the top photo." }

          - { name: heroImage, label: "Hero: photo", widget: image }
          - { name: heroImageAlt, label: "Hero: photo description (for screen readers)", widget: string }
          - { name: heroEyebrow, label: "Hero: small label", widget: string }
          - { name: heroTitle, label: "Hero: heading", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics" }
          - { name: heroSubtitle, label: "Hero: sub-heading", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics" }
          - { name: heroIntro, label: "Hero: intro", widget: text }
          - { name: heroPrimaryLabel, label: "Hero: quotation button text", widget: string }
          - { name: heroSecondaryLabel, label: "Hero: services button text", widget: string }

          - { name: servicesEyebrow, label: "Services: small label", widget: string }
          - { name: servicesTitle, label: "Services: heading", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics. The cards come from the Services list: tick Featured on a service to give it a card." }
          - { name: servicesIntro, label: "Services: intro", widget: text }
          - { name: alsoProvideLabel, label: "Services: label above the other services", widget: string }
          - { name: allServicesLabel, label: "Services: button text", widget: string }

          - { name: standardEyebrow, label: "Standard: small label", widget: string }
          - { name: standardTitle, label: "Standard: heading", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics" }
          - { name: standardBody, label: "Standard: intro (blank line between paragraphs)", widget: text }
          - name: standardStats
            label: "Standard: three big figures"
            widget: list
            summary: "{{figure}} {{label}}"
            fields:
              - { name: figure, label: "Figure (e.g. £5m)", widget: string }
              - { name: italic, label: "Figure in italics", widget: boolean, default: false }
              - { name: label, label: Label, widget: string }
              - { name: text, label: Line, widget: string }
          - { name: standardImage, label: "Standard: photo", widget: image }
          - { name: standardImageAlt, label: "Standard: photo description", widget: string }
          - name: standardPoints
            label: "Standard: points beside the photo"
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
          - { name: standardStatement, label: "Standard: closing statement", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics" }

          - { name: workEyebrow, label: "Our work: small label", widget: string }
          - { name: workTitle, label: "Our work: heading", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics. The slider shows projects ticked Show on homepage." }
          - { name: workLead, label: "Our work: large intro line", widget: string }
          - { name: workIntro, label: "Our work: intro", widget: text }
          - { name: workHint, label: "Our work: hint under the slider", widget: string }
          - { name: workMoreText, label: "Our work: text above the gallery button", widget: text }
          - { name: workMoreLabel, label: "Our work: gallery button text", widget: string }

          - { name: presentationImage, label: "Property presentation: photo", widget: image }
          - { name: presentationImageAlt, label: "Property presentation: photo description", widget: string }
          - { name: presentationCaption, label: "Property presentation: photo caption", widget: string }
          - { name: presentationEyebrow, label: "Property presentation: small label", widget: string }
          - { name: presentationTitle, label: "Property presentation: heading", widget: string, hint: "Wrap words in *asterisks* to show them in gold italics" }
          - { name: presentationLead, label: "Property presentation: large intro", widget: text }
          - { name: presentationBody, label: "Property presentation: text (blank line between paragraphs)", widget: text }
